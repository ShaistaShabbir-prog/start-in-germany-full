# Lighthouse CI — DISABLED
# Reason: requires a running Next.js server which needs full Vercel deployment
# Performance auditing done via Vercel Analytics instead
# Re-enable when a staging URL is available

name: Lighthouse CI (Disabled)
on:
  workflow_dispatch:   # manual trigger only — not automatic
    inputs:
      target_url:
        description: 'URL to audit'
        required: true
        default: 'https://start-in-germany-full.vercel.app'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse audit
        run: echo "Run manually with a target URL. Automatic runs disabled."
